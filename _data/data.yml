#
# 이 파일만 수정하면 사이트 전체 내용이 바뀝니다.
# YAML 문법 오류(들여쓰기, 콜론 뒤 공백 등) 하나로도 빌드가 실패할 수 있으니 주의하세요.
# 섹션을 숨기려면 해당 블록 전체를 주석(#) 처리하면 됩니다.
# 아래 내용은 모두 예시(placeholder)입니다. 본인 정보로 교체하세요.
#

sidebar:
  position: left   # left or right
  about: False     # True 로 바꾸면 "How to use" 안내 블록이 사이드바에 나타남
  education: True  # False 로 바꾸면 학력이 본문으로 이동

  # Profile information
  name: 김상우 (Kim, Sangwoo)
  tagline: Ph.D. Candidate
  avatar: profile.png  # /assets/images/ 폴더에 100x100 정사각형 사진을 넣고 파일명 입력

  # Sidebar links (사용하지 않는 항목은 비워두거나 주석 처리)
  email: your.name@example.com
  phone:
  website:          # https:// 포함 전체 URL
  linkedin:         # 아이디만
  github: sangwookim
  orcid:            # 예: 0000-0000-0000-0000
  scholar:          # Google Scholar user id (citations?user= 뒤의 값)
  pdf-en:           # 영문 CV PDF 링크
  pdf-kr:           # 국문 CV PDF 링크

  languages:
    title: Languages
    info:
    - idiom: Korean
      level: Native

    - idiom: English
      level: Professional working proficiency

  # interests:
  #   title: Interests
  #   info:
  #   - item: Running
  #     link:

career-profile:
  title: Introduction
  summary: |
    여기에 자신을 소개하는 짧은 글을 작성하세요. 연구 분야, 관심사, 현재 소속과
    하고 있는 일을 2~4문장 정도로 요약하면 좋습니다.

    Write a short introduction here: research interests, current position,
    and what you are working on. **Markdown** 과 [링크](https://github.com)를 사용할 수 있습니다.

