# Update all the sections by editing the data.yml file inside _data folder.
# Template: https://github.com/sharu725/online-cv

# Site Settings
title: Sangwoo Kim | CV
title_ko: 김상우 | CV
url: 'https://swtbkim.github.io'
baseurl: '/sangwookim' # project page: https://swtbkim.github.io/sangwookim/

description: Sangwoo Kim - Curriculum Vitae
# Style will be applied only after restarting the build or serve.
# blue turquoise green berry orange ceramic teal oceanstale mono
theme_skin: mono
chrome_mobile_color: '#2e2e2e'

# Tracker (Google Analytics ID가 있으면 입력)
analytics:

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html:
  clippings: all
  ignore:
    envs: development

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - LICENSE.md
  - vendor

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
